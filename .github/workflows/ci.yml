name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Run Python unit tests
      run: |
        pytest tests/ -v --tb=short

  build-firmware-c:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Compile embedded C firmware with GCC
      run: |
        gcc -Wall -Wextra -std=c99 -I firmware/include firmware/src/fft.c firmware/src/vibration_analyzer.c firmware/main.c -lm -o vibration_sentinel_bin
        ./vibration_sentinel_bin
